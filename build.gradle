plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'idea'
    id 'application'
    id 'info.solidsoft.pitest' version '1.19.0-rc.3'
    id 'com.gradleup.shadow' version '9.3.1'

}

apply plugin: 'info.solidsoft.pitest.aggregator' // to 'pitestReportAggregate' appear

group = 'com.nsa.cm6123-6623'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    mavenLocal()
}



dependencies {
    // call SLF4J
    implementation 'org.slf4j:slf4j-api:2.0.17'

    // delegate SLF4J to LOG4J
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'
    // core is LOG4J
    implementation platform('org.apache.logging.log4j:log4j-bom:2.25.3')
    implementation 'org.apache.logging.log4j:log4j-api:${log4j-api.version}'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'

/*    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter:5.11.4')
    testImplementation('org.mockito:mockito-core:5.15.2')
    testImplementation("org.junit.jupiter:junit-jupiter-params:5.11.4")*/

    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'

}

//test configuration
test{
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
//application configuration

run{
    standardInput = System.in
}

/*

uncomment if trying to run on a different version of Java.
you will need to rebuild.

jar {
    manifest {
        attributes ('Main-Class': 'com.cm6123.monopoly.app.Application',
        'Multi-Release':'true')

    }
    from sourceSets.main.allSource

}*/



application {
    mainClass = 'com.cm6123.monopoly.app.Application'
}

//tool configuration
checkstyle {
    toolVersion = "13.2.0"
    checkstyleMain.enabled = true
    checkstyleTest.enabled = false
}

checkstyleMain {
    configFile = file("config/checkstyle/checkstyleMain.xml")
    maxErrors = 10
}

jacoco {
    toolVersion = "0.8.12"
    //reportsDirectory = layout.buildDirectory.dir('jacocoHtml')
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')

        //html.destination file("${buildDir}/jacocoHtml")
    }
}
jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.5
            }
            excludes = [
                    'com.cm6123.monopoly.app.*'
            ]
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

build.dependsOn 'pitest'

// create combined task

task buildAndReport {
    group ="build"
    dependsOn build, jacocoTestReport
}

rootProject.tasks.named("jar") {
    duplicatesStrategy = 'include'
}

pitest {
    targetClasses = ['com.cm6123.monopoly.*']  //by default "${project.group}.*"
    //pitestVersion = '1.14.4' //not needed when a default PIT version should be used
    threads = 4
    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    junit5PluginVersion = '1.2.0'
    verbose = true

    reportAggregator {
        testStrengthThreshold.set(50)
        mutationThreshold.set(40)
        maxSurviving.set(3)
    }
    //verbose = true



}



