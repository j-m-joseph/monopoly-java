# image: openjdk:17-alpine
image: eclipse-temurin:21



default:
  tags:
    - comsc-ci
    #- general-docker


stages:
  - analyse
  - build
  - publish

before_script:
  - echo $GRADLE_HOME
  - echo `pwd`
  - export GRADLE_USER_HOME=`pwd`/.gradle
  - rm -f  .gradle/caches/modules-2/modules-2.lock
  - rm -fr .gradle/caches/*/plugin-resolution/
  - chmod +x gradlew
  
cache:
  key: gradle-cache-key
  paths:
    - .gradle/wrapper
    - .gradle/caches
  policy: pull

gitinspector:
  stage: analyse
  image: python:3.7
  before_script:
    - apt-get update && apt-get install -y git
    - git clone https://github.com/ejwa/gitinspector.git
    - cd gitinspector
    - git checkout v0.4.4
    - cd ..
  script:
    - mkdir -p reports
    - python gitinspector/gitinspector/gitinspector.py -HTlrm -F html -f html,js,json,css,csv,ts,java > reports/gitinspector.html
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    expose_as: 'GitInspector Report'
  only: 
    - tags

build:gradle:
  stage: build
  only:
    - tags
  script:

    - ./gradlew --continue buildAndReport
  cache:
    key: gradle-cache-key
    paths:
      - .gradle/wrapper
      - .gradle/caches
  artifacts:
    name: "$CI_JOB_NAME"
    paths:
      - ./build/classes/java/main
      - ./build/reports/checkstyle/
      - ./build/jacocoHtml/
      - ./build/reports/tests/
      - ./build/libs/*.jar
      - ./build/jacoco/test.exec

    expire_in: 4 week

pages:

  stage: publish
  only:
    - tags

  script:
    - pwd
    - mkdir --parents public/build/libs
    - mv ./build/reports/tests/ public
    - mv ./build/reports/checkstyle/ public
    - mv ./build/jacocoHtml/ public
    - mv ./build/libs/*.jar public/build/libs
    - mv ./reports/ public
    - pwd
    - ls -lR public

  cache:
    key: gradle-cache-key
    paths:
      - .gradle/wrapper
      - .gradle/caches

  artifacts:
    paths:
      - public

